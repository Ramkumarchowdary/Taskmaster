<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAM Todo List</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <div>
        <h1>RAM Todo List</h1>
        <p id="stats" class="muted"></p>
      </div>
      <button id="theme" class="icon-btn" aria-label="Toggle dark mode"><i class="fas fa-moon"></i></button>
    </header>

    <form id="add-form" class="add">
      <input id="task" type="text" placeholder="What needs doing?" required autocomplete="off">
      <select id="priority" aria-label="Priority">
        <option value="1">Low</option>
        <option value="2" selected>Medium</option>
        <option value="3">High</option>
      </select>
      <button class="primary" type="submit"><i class="fas fa-plus"></i> Add task</button>
    </form>

    <section class="tools">
      <nav id="filter" class="tabs" aria-label="Filter tasks">
        <button type="button" data-filter="all" class="active">All</button>
        <button type="button" data-filter="active">Uncompleted</button>
        <button type="button" data-filter="done">Completed</button>
      </nav>
    </section>

    <ul id="list" class="list"></ul>
    <p id="empty" class="empty" hidden>No tasks here. Add one above.</p>
  </main>
  <dialog id="confirm" class="modal" aria-labelledby="confirm-title">
    <form method="dialog">
      <div class="modal-icon"><i class="fas fa-trash"></i></div>
      <h2 id="confirm-title">Delete this task?</h2>
      <p>It isn't completed yet. Deleting it can't be undone.</p>
      <div class="modal-actions">
        <button value="cancel" class="btn-keep" autofocus>Keep task</button>
        <button value="ok" class="btn-danger">Delete</button>
      </div>
    </form>
  </dialog>
  <script src="./app.js"></script>
</body>
</html>
